name: Humanitarian Aid Training Monitor

on:
  # Run manually from GitHub Actions
  workflow_dispatch:

  # Run every 12 hours
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Athens"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests python-dotenv openai

      # 4. Install Chromium for Playwright
      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # 5. Recreate auth_state.json from GitHub Secret
      - name: Restore Playwright authentication
        env:
          PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
        run: |
          printf '%s' "$PLAYWRIGHT_AUTH_STATE" > auth_state.json

      # 6. Run the monitor
      - name: Run humanitarian aid monitor
        env:
          TRAINING_URL: https://youth.europa.eu/solidarity/dashboard/training-humanitarian-aid_en

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python monitor.py

      # 7. Delete authentication file after the run
      - name: Clean up authentication state
        if: always()
        run: |
          rm -f auth_state.json