name: Humanitarian Aid Training Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Athens"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests python-dotenv openai

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run humanitarian aid monitor
        env:
          TRAINING_URL: https://youth.europa.eu/solidarity/dashboard/training-humanitarian-aid_en

          ECAS_USERNAME: ${{ secrets.ECAS_USERNAME }}
          ECAS_PASSWORD: ${{ secrets.ECAS_PASSWORD }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python monitor.py