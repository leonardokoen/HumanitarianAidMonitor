name: Humanitarian Aid Training Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Athens"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t humanitarian-aid-monitor \
            .

      - name: Run monitor
        env:
          ECAS_USERNAME: ${{ secrets.ECAS_USERNAME }}
          ECAS_PASSWORD: ${{ secrets.ECAS_PASSWORD }}

          TRAINING_URL: https://youth.europa.eu/solidarity/dashboard/training-humanitarian-aid_en

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          docker run --rm \
            -e ECAS_USERNAME \
            -e ECAS_PASSWORD \
            -e TRAINING_URL \
            -e AZURE_OPENAI_ENDPOINT \
            -e AZURE_OPENAI_API_KEY \
            -e AZURE_OPENAI_API_VERSION \
            -e AZURE_OPENAI_DEPLOYMENT \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            humanitarian-aid-monitor